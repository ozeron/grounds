# grounds-json: the JSON library (to be published as grounds-json)
language: "bend"
dependsOn:
  - "decimal"
  - "io"
  - "utf8"

tasks:
  check:
    command: "python3 ../tools/check_package.py json/check -- ./check.sh"
    inputs:
      - "**/*"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/check_package.py"
    options:
      cache: false
  bench:
    command: "bench/run.sh"
    options:
      cache: false
  bench-big:
    command: "bench/big.sh"
    options:
      cache: false
  build:
    command: "scripts/build.sh"
    inputs:
      - "*.bend"
      - "scripts/**/*"
    outputs:
      - "grounds-json"
