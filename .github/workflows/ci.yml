name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Linux only: building the fast loop takes about 9 GB, over a macOS runner's 7
jobs:
  ci:
    runs-on: ubuntu-latest
    # the emitted C uses clang's musttail, which gcc (the runner's cc) rejects
    env:
      CC: clang
    # redis:check runs its live tests against these: one open, one with a password
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      # a service can't pass --requirepass, and bitnami/redis is gone from Docker Hub
      - run: docker run -d --name redis-auth -p 6380:6379 redis:7-alpine redis-server --requirepass s3cret
      - uses: jdx/mise-action@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y hyperfine clang llvm apache2-utils ripgrep
      - run: moon run :check
      - run: QUICK=1 bench/run.sh
        working-directory: json
      # nightly: a long fuzz; failing inputs go to json/examples/regress/
      - if: github.event_name == 'schedule'
        run: SEED=${{ github.run_number }} N=30000 FAIL_DIR=fails python3 scripts/integration.py
        working-directory: json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: json/fails/
          if-no-files-found: ignore
