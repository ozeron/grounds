name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Linux only: building the fast loop takes about 9 GB, over a macOS runner's 7
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y hyperfine clang llvm
      - run: moon run json:check
      - run: QUICK=1 bench/run.sh
        working-directory: json
      # nightly: a long fuzz; failing inputs go to json/examples/regress/
      - if: github.event_name == 'schedule'
        run: SEED=${{ github.run_number }} N=30000 FAIL_DIR=fails python3 scripts/integration.py
        working-directory: json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: json/fails/
          if-no-files-found: ignore
