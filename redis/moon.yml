# grounds-redis: a Redis client (RESP2)
language: "bend"
dependsOn:
  - "decimal"
  - "utf8"
  - "wire"

tasks:
  check:
    command: "./check.sh"
    inputs:
      - "/json/scripts/cold.py"
      - "*.bend"
      - "proof/*.bend"
      - "/decimal/*.bend"
      - "/decimal/proof/*.bend"
      - "examples/*.bend"
