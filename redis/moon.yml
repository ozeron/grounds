# grounds-redis: a Redis client (RESP2)
language: "bend"
dependsOn:
  - "utf8"
  - "wire"

tasks:
  check:
    command: "python3 ../tools/check_package.py redis/check -- ./check.sh"
    inputs:
      - "check.sh"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/check_package.py"
      - "/json/scripts/cold.py"
      - "*.bend"
      - "examples/*.bend"
