# grounds-wire: TCP on bytes
language: "bend"
dependsOn:
  - "crypto"

tasks:
  check:
    command: "./check.sh"
    inputs:
      - "check.sh"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/bend_native.sh"
      - "/tools/bend_native_parts.py"
      - "/json/scripts/cold.py"
      - "*.bend"
      - "*.py"
      - "*_vectors.json"
      - "*.c"
      - "*.mjs"
      - "effs/*"
      - "/crypto/*.bend"
      - "/crypto/*.py"
      - "/io/*.bend"
