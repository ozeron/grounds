# grounds-rtc: early STUN and WebRTC protocols
language: "bend"
dependsOn:
  - "crypto"
  - "wire"
  - "io"
  - "utf8"
  - "json"
  - "http_server"

tasks:
  check:
    command: "./check.sh"
    inputs:
      - "check.sh"
      - "check_inputs.py"
      - "check_inputs_test.py"
      - "*.bend"
      - "examples/*"
      - "/crypto/bytes.bend"
      - "/crypto/hmac.bend"
      - "/crypto/hmac_sha1.bend"
      - "/crypto/sha1.bend"
      - "/crypto/sha256.bend"
      - "/wire/wire.bend"
      - "/wire/effs/*"
      - "/wire/udp_test_support.py"
      - "/io/*.bend"
      - "/io/effs/*"
      - "/utf8/*.bend"
      - "/json/*.bend"
      - "/json/effs/*"
      - "/http/core/*.bend"
      - "/http/wire/*.bend"
      - "/http/server/*.bend"
