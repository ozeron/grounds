# grounds-http-json: JSON request bodies and responses
language: "bend"
dependsOn:
  - "http_core"
  - "json"
  - "http_router"
  - "http_server"

tasks:
  check:
    command: "python3 ../../tools/check_package.py http_json/check -- ./check.sh"
    inputs:
      - "check.sh"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/check_package.py"
      - "/json/scripts/cold.py"
      - "*.bend"
      - "examples/*.bend"
