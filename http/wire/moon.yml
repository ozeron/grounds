# grounds-http-wire: HTTP/1.1 on the wire (RFC 9112)
language: "bend"
dependsOn:
  - "http_core"
  - "utf8"

tasks:
  check:
    command: "python3 ../../tools/check_package.py http_wire/check -- ./check.sh"
    inputs:
      - "check.sh"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/check_package.py"
      - "/json/scripts/cold.py"
      - "*.bend"
      - "examples/*.bend"
