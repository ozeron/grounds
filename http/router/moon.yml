# grounds-http-router: routes as data
language: "bend"
dependsOn:
  - "http_core"

tasks:
  check:
    command: "python3 ../../tools/check_package.py http_router/check -- ./check.sh"
    inputs:
      - "check.sh"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/check_package.py"
      - "/json/scripts/cold.py"
      - "*.bend"
      - "examples/*.bend"
