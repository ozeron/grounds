# grounds-http-client: HTTP/1.1 requests to other services
language: "bend"
dependsOn:
  - "http_core"
  - "http_wire"
  - "http_server"
  - "wire"
  - "utf8"

tasks:
  check:
    command: "python3 ../../tools/check_package.py http_client/check -- ./check.sh"
    inputs:
      - "check.sh"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/check_package.py"
      - "/json/scripts/cold.py"
      - "*.bend"
      - "tests/*"
