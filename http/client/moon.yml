# grounds-http-client: HTTP/1.1 requests to other services
language: "bend"
dependsOn:
  - "http_core"
  - "http_wire"
  - "http_server"
  - "wire"
  - "utf8"
  - "crypto"
  - "json"

tasks:
  check:
    command: "sh ./check_all.sh"
    inputs:
      - "check.sh"
      - "check_all.sh"
      - "bend_check.sh"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/check_package.py"
      - "/json/scripts/cold.py"
      - "*.bend"
      - "tests/*"
      - "/http/server/examples/bend_tls_build.py"
      - "/http/server/examples/bend_native_audit.py"
      - "/http/server/examples/bend_tls_check.py"
      - "/http/server/examples/bend_m4b_peer.go"
      - "/http/server/examples/legacy_graph_audit.py"
      - "/http/server/*.bend"
      - "/http/server/examples/*.bend"
      - "/http/server/effs/*"
      - "/wire/bend_tls_no_delegation_build.py"
      - "/wire/bend_tls_no_openssl_check.py"
      - "/wire/bend_tls_client_check.py"
      - "/wire/*.bend"
      - "/wire/effs/*"
      - "/crypto/*.bend"
      - "/crypto/*.bin"
      - "/crypto/gcm_check.py"
      - "/decimal/*.bend"
      - "/io/*.bend"
      - "/io/effs/*"
