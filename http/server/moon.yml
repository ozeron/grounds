# grounds-http-server: serve(handler, config) on HTTP/1.1
language: "bend"
dependsOn:
  - "http_core"
  - "http_wire"
  - "wire"
  - "crypto"
  - "utf8"

tasks:
  check:
    command: "./check.sh"
    inputs:
      - "check.sh"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/bend_native.sh"
      - "/tools/bend_native_parts.py"
      - "*.bend"
      - "examples/*"
      - "effs/*"
      - "/wire/bend_tls_no_delegation_build.py"
      - "/wire/bend_tls_no_openssl_check.py"
      - "/wire/bend_tls_client_check.py"
      - "/crypto/gcm_check.py"
      - "/http/core/*.bend"
      - "/http/core/effs/*"
      - "/http/wire/*.bend"
      - "/wire/*.bend"
      - "/wire/effs/*"
      - "/wire/examples/*"
      - "/crypto/*.bend"
      - "/io/*.bend"
      - "/io/effs/*"
      - "/utf8/*.bend"
      - "/json/*.bend"
      - "/json/scripts/cold.py"
