# grounds-http-server: serve(handler, config) on HTTP/1.1
language: "bend"
dependsOn:
  - "http_core"
  - "http_wire"
  - "wire"
  - "crypto"
  - "utf8"

tasks:
  check:
    command: "./check.sh"
    inputs:
      - "check.sh"
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/bend_native.sh"
      - "*.bend"
      - "examples/*"
      - "/http/core/*.bend"
      - "/http/core/effs/*"
      - "/http/wire/*.bend"
      - "/wire/*.bend"
      - "/wire/effs/*"
      - "/wire/examples/*"
      - "/crypto/*.bend"
      - "/io/*.bend"
      - "/io/effs/*"
      - "/utf8/*.bend"
      - "/json/*.bend"
      - "/json/scripts/cold.py"
