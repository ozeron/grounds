# grounds-http-core: HTTP messages (RFC 9110): methods, status, headers, query,
# request and response. HTTP/1.1, the server, routing and JSON come as
# separate packages on top
language: "bend"
dependsOn:
  - "utf8"
  - "crypto"

tasks:
  check:
    command: "python3 ../../tools/check_package.py http_core/check -- ./check.sh"
    inputs:
      - "check_phases.json"
      - "/tools/check_phase.py"
      - "/tools/check_package.py"
      - "check.sh"
      - "check_units.py"
      - "check_proofs.py"
      - "*.bend"
      - "examples/*"
      - "effs/*"
      - "/tools/bend_native.sh"
      - "/tools/bend_native_parts.py"
      - "/crypto/bytes.bend"
      - "/crypto/hmac.bend"
      - "/crypto/sha256.bend"
      - "/json/json.bend"
      - "/json/scripts/cold.py"
      - "/io/*.bend"
      - "/io/effs/*"
      - "/utf8/*.bend"
